<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transmissor de Tela - OBS</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0; min-height: 100vh; background: #0d0d0d; color: #fff;
            font-family: system-ui, -apple-system, sans-serif;
            display: flex; align-items: center; justify-content: center; padding: 20px;
        }
        .card {
            width: 100%; max-width: 460px; background: #181818;
            border: 1px solid #2c2c2c; border-radius: 16px; padding: 28px;
            text-align: center; box-shadow: 0 12px 30px rgba(0,0,0,0.45);
        }
        h1 { margin: 0 0 8px; font-size: 22px; }
        p { margin: 0 0 20px; font-size: 14px; color: #aaa; line-height: 1.5; }
        .status {
            display: inline-flex; align-items: center; gap: 8px;
            background: #242424; padding: 8px 14px; border-radius: 999px;
            font-size: 13px; font-weight: 700; margin-bottom: 22px;
        }
        .ponto { width: 10px; height: 10px; border-radius: 50%; background: #888; }
        .ponto.pronto { background: #2fff00; }
        .ponto.aguardando { background: #ffaa00; }
        .ponto.no-ar { background: #ff2a2a; animation: piscar 1.2s infinite; }
        @keyframes piscar { 0%, 100% { opacity: 1; } 50% { opacity: 0.25; } }

        button {
            width: 100%; padding: 16px; border: none; border-radius: 12px;
            font-size: 16px; font-weight: 700; cursor: pointer; color: #fff;
            background: #007a08; text-transform: uppercase; letter-spacing: 0.5px;
            transition: background 0.2s, transform 0.1s;
        }
        button:active { transform: scale(0.98); }
        button.ao-vivo { background: #c62828; }
        button:disabled { background: #333; color: #777; cursor: not-allowed; }

        .dica {
            margin-top: 18px; padding: 12px; border-radius: 10px;
            background: rgba(255, 193, 7, 0.1); border: 1px solid rgba(255, 193, 7, 0.25);
            font-size: 12px; color: #ffd54f; text-align: left;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>🖥️ Transmissor de Tela</h1>
        <p>Envie a tela e o áudio deste computador direto para o OBS Studio.</p>

        <div class="status">
            <span class="ponto pronto" id="ponto"></span>
            <span id="texto-status">Pronto para transmitir</span>
        </div>

        <button id="btn-transmitir">▶ Compartilhar Tela + Áudio</button>

        <div class="dica" id="box-dica">
            <strong>Importante:</strong> Escolha a tela inteira e marque <strong>"Compartilhar áudio do sistema"</strong>. Não minimize esta janela depois de iniciar.
        </div>
    </div>

    <script>
        const SALA_URL = "https://votacao-bc712-default-rtdb.firebaseio.com/transmissao_tela_obs";

        const btn = document.getElementById('btn-transmitir');
        const textoStatus = document.getElementById('texto-status');
        const ponto = document.getElementById('ponto');
        const boxDica = document.getElementById('box-dica');

        const rtcConfig = {
            iceServers: [
                { urls: 'stun:stun.l.google.com:19302' },
                { urls: 'stun:stun1.l.google.com:19302' },
                { urls: 'stun:stun2.l.google.com:19302' }
            ]
        };

        let pc = null;
        let streamAtual = null;
        let timerResposta = null;

        if (!navigator.mediaDevices || !navigator.mediaDevices.getDisplayMedia) {
            btn.disabled = true;
            btn.textContent = 'Indisponível em celulares';
            textoStatus.textContent = 'Use em um computador';
            ponto.className = 'ponto';
            boxDica.innerHTML = '<strong>Aviso:</strong> Navegadores de celular bloqueiam compartilhamento de tela por site.';
        }

        function aguardarIce(peerConnection) {
            return new Promise((resolve) => {
                if (peerConnection.iceGatheringState === 'complete') return resolve();
                const timeout = setTimeout(resolve, 1800);
                peerConnection.onicegatheringstatechange = () => {
                    if (peerConnection.iceGatheringState === 'complete') {
                        clearTimeout(timeout);
                        resolve();
                    }
                };
            });
        }

        async function encerrarTransmissao() {
            if (timerResposta) { clearInterval(timerResposta); timerResposta = null; }
            if (pc) { try { pc.close(); } catch (e) {} pc = null; }
            if (streamAtual) {
                streamAtual.getTracks().forEach(t => t.stop());
                streamAtual = null;
            }
            fetch(`${SALA_URL}.json`, { method: 'DELETE' }).catch(() => {});

            textoStatus.textContent = 'Pronto para transmitir';
            ponto.className = 'ponto pronto';
            btn.textContent = '▶ Compartilhar Tela + Áudio';
            btn.classList.remove('ao-vivo');
        }

        btn.onclick = async () => {
            if (streamAtual) {
                await encerrarTransmissao();
                return;
            }

            try {
                streamAtual = await navigator.mediaDevices.getDisplayMedia({
                    video: {
                        width: { ideal: 1920 },
                        height: { ideal: 1080 },
                        frameRate: { ideal: 30, max: 30 }
                    },
                    audio: {
                        echoCancellation: false,
                        noiseSuppression: false,
                        autoGainControl: false
                    }
                });

                streamAtual.getVideoTracks()[0].onended = () => encerrarTransmissao();

                textoStatus.textContent = 'Conectando ao OBS...';
                ponto.className = 'ponto aguardando';
                btn.textContent = '✖ Encerrar Transmissão';
                btn.classList.add('ao-vivo');

                pc = new RTCPeerConnection(rtcConfig);

                streamAtual.getTracks().forEach(track => {
                    const sender = pc.addTrack(track, streamAtual);
                    if (track.kind === 'video') {
                        setTimeout(async () => {
                            try {
                                const params = sender.getParameters();
                                if (!params.encodings) params.encodings = [{}];
                                params.encodings[0].maxBitrate = 4000000;
                                await sender.setParameters(params);
                            } catch (e) {}
                        }, 1000);
                    }
                });

                pc.onconnectionstatechange = () => {
                    if (!pc) return;
                    if (pc.connectionState === 'connected') {
                        textoStatus.textContent = 'NO AR (OBS CONECTADO)';
                        ponto.className = 'ponto no-ar';
                    } else if (pc.connectionState === 'failed' || pc.connectionState === 'disconnected') {
                        textoStatus.textContent = 'Sinal interrompido — tente novamente';
                        ponto.className = 'ponto aguardando';
                    }
                };

                const offer = await pc.createOffer();
                await pc.setLocalDescription(offer);
                await aguardarIce(pc);

                const ts = Date.now();
                await fetch(`${SALA_URL}.json`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        offer: {
                            type: pc.localDescription.type,
                            sdp: pc.localDescription.sdp,
                            ts: ts
                        },
                        answer: null
                    })
                });

                // Aguarda a resposta do OBS via HTTPS
                timerResposta = setInterval(async () => {
                    if (!pc || pc.currentRemoteDescription) {
                        clearInterval(timerResposta);
                        timerResposta = null;
                        return;
                    }
                    try {
                        const res = await fetch(`${SALA_URL}/answer.json?t=${Date.now()}`);
                        const ans = await res.json();
                        if (ans && ans.ts === ts && ans.sdp && pc && !pc.currentRemoteDescription) {
                            clearInterval(timerResposta);
                            timerResposta = null;
                            await pc.setRemoteDescription(new RTCSessionDescription({ type: ans.type, sdp: ans.sdp }));
                        }
                    } catch (e) {}
                }, 1000);

            } catch (err) {
                await encerrarTransmissao();
                textoStatus.textContent = 'Compartilhamento cancelado';
            }
        };

        window.addEventListener('beforeunload', () => {
            if (streamAtual) {
                fetch(`${SALA_URL}.json`, { method: 'DELETE', keepalive: true }).catch(() => {});
            }
        });
    </script>
</body>
</html>
